name: build

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: "${{ github.sha }}"

env:
  PROJECT_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Oras
        run: |
          curl -L https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz | \
            tar -xz -C /usr/local/bin oras
        env:
          ORAS_VERSION: 1.2.2

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Install Oras
        run: |
          curl -L https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz | \
            tar -xz -C /usr/local/bin oras
        env:
          ORAS_VERSION: 1.2.2

      - name: Push dashboards into the development namespace
        run: |
          oras push ghcr.io/${{ github.repository }}/${{ env.PROJECT_NAME }}-dashboards:${{ inputs.tag }} \
            count-items-cronjob/alerts.yaml:application/prometheus-alerts+yaml \
            update-bucket-capacity-info-cronjob/alerts.yaml:application/prometheus-alerts+yaml
        working-directory: monitoring

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          provenance: false
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
